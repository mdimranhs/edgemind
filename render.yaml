services:
  - type: web
    name: edgemind-api
    runtime: docker
    plan: starter
    branch: main
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: hf_api
      - key: HF_TOKEN
        sync: false  # Set manually in Render dashboard
      - key: HF_MODEL
        value: Qwen/Qwen2.5-1.5B-Instruct
      - key: DEBUG
        value: false
      - key: WEB_SEARCH_ENABLED
        value: true
